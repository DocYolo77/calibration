name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q --cov=yolo_calibration --cov-report=term-missing tests/

      - name: Check config files are valid YAML
        run: |
          python - <<'EOF'
          import pathlib, yaml
          for f in pathlib.Path("config").glob("*.yaml"):
              yaml.safe_load(f.read_text())
              print(f"OK: {f}")
          EOF
