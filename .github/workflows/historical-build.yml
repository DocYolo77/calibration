name: Historical Build

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2022-01-01"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
      rebuild:
        description: "Force re-fetch of already-checkpointed raw data"
        required: false
        type: boolean
        default: false
      rs_benchmark_year:
        description: "Optional: build the RS benchmark report (reports/rs_benchmark.py) for this single calendar year (e.g. 2024). Leave empty to skip. start_date/end_date above can span extra years purely as point-in-time warmup/lookback history for RS3M/6M/12M and ADR20 -- only this year's signal rows ever appear in the RS benchmark report itself."
        required: false
        default: ""

jobs:
  historical-build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: pip install -e .

      # Raw checkpoint files + reference-data cache are restored here so a
      # re-run of this workflow (e.g. after a timeout or transient API
      # failure) resumes instead of re-fetching already-downloaded days
      # (spec section 17: "Bei Abbruch soll nicht alles erneut geladen
      # werden müssen.").
      - name: Restore raw data + reference cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/cache
          key: yolo-raw-${{ inputs.start_date }}-${{ inputs.end_date }}-${{ github.run_id }}
          restore-keys: |
            yolo-raw-${{ inputs.start_date }}-${{ inputs.end_date }}-

      - name: Fetch raw grouped-daily + reference tickers
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.rebuild }}" = "true" ]; then FORCE_FLAG="--force"; fi
          python -m yolo_calibration fetch-raw --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}" $FORCE_FLAG

      - name: Fetch QQQ point-in-time constituents
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.rebuild }}" = "true" ]; then FORCE_FLAG="--force"; fi
          python -m yolo_calibration fetch-qqq-constituents --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}" $FORCE_FLAG || \
          echo "::warning::QQQ constituent fetch failed or incomplete — QQQ health track may be unavailable (spec section 10 hard-stop behavior)."

      - name: Materialize reference_tickers table
        run: python -m yolo_calibration build-reference-tickers --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}"

      # After all fetch attempts above (grouped_daily x2, qqq_constituents
      # best-effort, reference_tickers) so it reflects the actual raw
      # checkpoint coverage for this run, whatever it turned out to be.
      - name: Materialize raw_manifest table
        run: python -m yolo_calibration build-raw-manifest --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}"

      - name: Build market universe
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python -m yolo_calibration build-universe --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}" --no-fetch

      - name: Build stock features
        run: python -m yolo_calibration build-stock-features --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}"

      - name: Build stock outcomes
        run: python -m yolo_calibration build-stock-outcomes --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}"

      - name: Build QQQ health (non-fatal if unavailable)
        run: |
          python -m yolo_calibration build-qqq-health --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}" --no-fetch || \
          echo "::warning::QQQ health build did not complete — see reports/data_quality_report.md for the reason."

      - name: Build QQQ outcomes (best-effort)
        run: python -m yolo_calibration build-qqq-outcomes --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}" || true

      # Independent of QQQ health/constituents availability (see
      # outcomes/build_market_breadth.py) — always run, not best-effort.
      - name: Build market breadth (D+H actual-eligible-universe RS breadth)
        run: python -m yolo_calibration build-market-breadth --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}"

      - name: Verify + generate reports
        run: python -m yolo_calibration verify --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}"

      # Optional, single-year, purely descriptive (reports/rs_benchmark.py).
      # Deliberately decoupled from start_date/end_date above: those may
      # span extra years as warmup/lookback for RS3M/6M/12M and ADR20 (both
      # need trailing history a single isolated year can't supply on its
      # own), but this report must never treat a warmup year as an output
      # period -- it reads ONLY the rs_benchmark_year partition (see
      # cli.py::cmd_build_rs_benchmark_report, hard single-calendar-year
      # guard).
      - name: Build RS benchmark report (optional, single year)
        if: inputs.rs_benchmark_year != ''
        run: |
          python -m yolo_calibration build-rs-benchmark-report \
            --start "${{ inputs.rs_benchmark_year }}-01-01" \
            --end "${{ inputs.rs_benchmark_year }}-12-31"

      # Robustness check ONLY, additive to the step above -- restricts to
      # rows where all 6 RS horizons are simultaneously populated, so the
      # six horizons are compared on an IDENTICAL population instead of each
      # horizon's own (slightly different) lookback-eligible set. Writes to
      # a separate rs_benchmark_{year}_common_sample/ directory; never
      # overwrites the full-sample report above (cli.py::cmd_build_rs_benchmark_common_sample_report).
      - name: Build RS benchmark common-sample report (optional, single year)
        if: inputs.rs_benchmark_year != ''
        run: |
          python -m yolo_calibration build-rs-benchmark-common-sample-report \
            --start "${{ inputs.rs_benchmark_year }}-01-01" \
            --end "${{ inputs.rs_benchmark_year }}-12-31"

      # Phase-2 descriptive study (reports/rs_atr_extension_study.py),
      # additive to the two steps above -- reuses the same rs_benchmark_year
      # input and the same single-calendar-year / point-in-time-lookback
      # discipline, but writes to its OWN rs_atr_extension_{year}/ directory
      # and never touches the rs_benchmark_{year}/ or
      # rs_benchmark_{year}_common_sample/ report directories
      # (cli.py::cmd_build_rs_atr_extension_study).
      - name: Build RS x ATR Extension study (optional, single year)
        if: inputs.rs_benchmark_year != ''
        run: |
          python -m yolo_calibration build-rs-atr-extension-study \
            --start "${{ inputs.rs_benchmark_year }}-01-01" \
            --end "${{ inputs.rs_benchmark_year }}-12-31"

      # Phase-2 descriptive study (reports/opportunity_state_study.py):
      # RS x EMA10/EMA20-distance and previous-extension ("repeat
      # offender") cross-tabulations. Unlike the two steps above, this one
      # needs REAL trailing history for the previous-extension windows
      # (60 trading days) -- passes the job's full start_date (which
      # already spans extra years purely as point-in-time lookback) as
      # `start`, and rs_benchmark_year-12-31 as `end`; only end.year's
      # signal rows ever appear in the report
      # (cli.py::cmd_build_opportunity_state_study). Writes to its own
      # opportunity_state_{year}/ directory, never touching the
      # rs_benchmark_*/ or rs_atr_extension_*/ report directories.
      - name: Build Opportunity-State study (optional, single target year)
        if: inputs.rs_benchmark_year != ''
        run: |
          python -m yolo_calibration build-opportunity-state-study \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.rs_benchmark_year }}-12-31"

      # Opportunity-State Candidate Rules v1 (reports/opportunity_state_candidate_rules.py):
      # a FROZEN, deliberately simple Normal/Extended/Resetting classification
      # derived from the descriptive studies above. Run TWICE with the exact
      # same thresholds -- once for rs_benchmark_year (the year the rules were
      # derived from) and once hardcoded for 2023 (the frozen robustness
      # check, spec section 6: rules are never reoptimized against 2023). Both
      # need real trailing history before their target year, hence `start`
      # (the job's full start_date, spanning extra years purely as point-in-time
      # lookback) rather than the target year alone.
      - name: Build Opportunity-State Candidate Rules report (target year)
        if: inputs.rs_benchmark_year != ''
        run: |
          python -m yolo_calibration build-opportunity-state-candidate-rules-report \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.rs_benchmark_year }}-12-31"

      # continue-on-error: this step only makes sense when start_date's
      # year is before 2023 (it needs real lookback before its own target
      # year, same guard as the step above) -- a run dispatched with e.g.
      # start_date=2023-01-01 for the OTHER Phase-2 steps correctly fails
      # this one, and that must never cascade into skipping every later
      # step (GitHub Actions skips subsequent default-condition steps
      # after a failure) -- this step's own success or failure is
      # independent of the rest of the job.
      - name: Build Opportunity-State Candidate Rules report (2023 robustness check, frozen rules)
        if: inputs.rs_benchmark_year == '2024'
        continue-on-error: true
        run: |
          python -m yolo_calibration build-opportunity-state-candidate-rules-report \
            --start "${{ inputs.start_date }}" \
            --end "2023-12-31"

      # EMA Pullback Range Study (reports/ema_pullback_range_study.py):
      # calibrates ONLY the future "EMA10 Pullback" / "EMA20 Pullback"
      # dashboard labels.
      - name: Build EMA Pullback Range Study (target year)
        if: inputs.rs_benchmark_year != ''
        run: |
          python -m yolo_calibration build-ema-pullback-range-study \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.rs_benchmark_year }}-12-31"

      # 2023 robustness check for the candidate ranges proposed from the
      # 2024 study above (EMA10/EMA20 Pullback: -5% to +6%, approved for
      # this frozen check) -- CANDIDATE_GRID_LO/HI in
      # ema_pullback_range_study.py are fixed module constants, so the
      # SAME exploratory grid (including the -5/+6 row) is recomputed
      # unchanged against 2023, nothing here re-derives or re-optimizes
      # against 2023 itself. Same continue-on-error rationale as the
      # Candidate Rules 2023 step above.
      - name: Build EMA Pullback Range Study (2023 robustness check, frozen candidate grid)
        if: inputs.rs_benchmark_year == '2024'
        continue-on-error: true
        run: |
          python -m yolo_calibration build-ema-pullback-range-study \
            --start "${{ inputs.start_date }}" \
            --end "2023-12-31"

      # Runs at the END (after the expensive market-cap enrichment step, not
      # before it) and unconditionally via if: always(), so that raw
      # checkpoints AND every market-cap lookup made so far are persisted
      # even if a later step fails or the job times out — a re-run with the
      # same start_date/end_date then resumes instead of redoing this work.
      # (Saving only once, here, also avoids a duplicate-key conflict with
      # the "Restore" step's cache entry — actions/cache keys are immutable
      # within a run.)
      - name: Save raw + reference-data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/cache
          key: yolo-raw-${{ inputs.start_date }}-${{ inputs.end_date }}-${{ github.run_id }}

      - name: Upload processed data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yolo-calibration-processed-${{ inputs.start_date }}-${{ inputs.end_date }}
          path: |
            data/processed
            reports
          retention-days: 30
