# Explicit, documented methodology for approximating point-in-time market cap.
#
# Per project spec section 3: if an approximation is necessary, the method
# must be documented, current market cap must never be used retroactively,
# and no undocumented assumption may be made. This file is that documentation
# AND the single source of truth the code reads from (src/yolo_calibration/
# universe/build_universe.py::compute_point_in_time_market_cap).

schema_version: 1

method: "historical_close_times_pit_shares_outstanding"

description: >
  Point-in-time market cap on date D for ticker T is computed as:

      market_cap(T, D) = close_price_UNADJUSTED(T, D) * shares_outstanding(T, D)

  where:
    - close_price_UNADJUSTED(T, D) is the actual AS-TRADED closing price on
      date D — fetched separately from the `adjusted=true` series used for
      technical features, via a second grouped-daily call with
      `adjusted=false` (see data/fetch_raw.py::fetch_grouped_daily_unadjusted_range,
      data/loaders.py::load_grouped_daily_unadjusted_range). Never a later
      date, and never the split-adjusted close.
    - shares_outstanding(T, D) is the weighted_shares_outstanding value
      returned by the Massive ticker-overview endpoint when queried with
      `date=D`. That endpoint resolves shares outstanding as of the most
      recent SEC filing at-or-before D, which is itself point-in-time by
      construction on the vendor side.

  This deliberately avoids ever multiplying a historical price by CURRENT
  (today's) shares outstanding, and avoids ever using today's market_cap
  field rewound onto a historical date.

why_unadjusted_close_specifically: >
  Investigated 2026-08-12 after the first full-year (2023) live backfill
  showed 46 tickers with close prices in the hundreds of billions of USD
  (e.g. MULN at ~$14.1B/share on 2023-06-15, vs. a real traded price of
  ~$1-3). Root cause: the `adjusted=true` grouped-daily series back-adjusts
  a historical close using ALL stock splits known as of the BUILD date
  (e.g. 2026), not just splits known as of that historical date — for
  penny stocks with several reverse splits between the historical date and
  the build date, this compounds into absurd absolute price levels.

  This does NOT corrupt the technical feature/outcome pipeline
  (ADR20, returns, ATR%, ATR extension, thrust, RS percentiles,
  distance-from-MA, MFE/MAE, ATR multiples): every one of those formulas is
  a RATIO of quantities computed from the SAME ticker's SAME
  (consistently, uniformly over-adjusted) price series, so the erroneous
  scale factor cancels out algebraically — see
  tests/test_scale_invariance.py, which locks this property in as a
  regression test. Verified empirically too: MULN's ADR20 in June 2023
  (~12-20%) is a physically plausible number for a volatile penny stock,
  even though its absolute close price that same month is nonsense.

  market_cap is the one place this DOES matter, because it is NOT a ratio
  within one ticker's own series — it multiplies price by an externally
  sourced share count. An over-adjusted price there produces a genuinely
  wrong market cap (and, worse, can flip a name from ineligible to
  eligible purely due to the price artifact). Hence: market_cap uses the
  unadjusted close; every other feature/outcome keeps using the adjusted
  (split-continuous) series, which is standard and correct practice for
  ratio-based technical analysis.

known_limitations:
  - >
    Shares-outstanding data is only as fresh as the issuer's most recent SEC
    filing before date D; for names that filed infrequently, this can lag
    true shares outstanding by up to one reporting period. This is a vendor
    data limitation, not a modeling choice, and applies symmetrically to all
    tickers.
  - >
    For tickers with multiple share classes, weighted_shares_outstanding
    (as opposed to share_class_shares_outstanding) is used, since it is the
    field Massive documents as adjusted for convertibility across classes
    and is the closer analogue to a market-cap-relevant share count.
  - >
    Reference/fundamental lookups (ticker-overview) are cached per
    (ticker, filing-effective-window) rather than per (ticker, date), since
    shares outstanding only changes at filing boundaries. This is a caching
    optimization only and does not change the point-in-time value returned
    for any given date.
  - >
    MONTHLY caching granularity (queried at the first-of-month date, see
    fetch_point_in_time_shares_outstanding): a share-count change that
    happens mid-month (e.g. a large ATM raise, a reverse split, or a filing
    correction) is only picked up starting the NEXT month's bucket, never
    retroactively within the month it occurred. This is a deliberate Phase 1
    precision/cost tradeoff, not a bug — see decided_for_phase_1 below.
  - >
    Found 2026-08-13 auditing the (now fixed) 2023 backfill: for tickers with
    FREQUENT corporate actions in short succession (repeated reverse splits /
    heavy dilution — MULN in 2023 is the canonical example), the
    month-to-month weighted_shares_outstanding value itself can swing by an
    order of magnitude between adjacent monthly buckets, producing an
    implausible market_cap swing even though the (correctly unadjusted)
    price moves smoothly. This is a vendor point-in-time-filing artifact,
    not a price-adjustment bug (that issue — see why_unadjusted_close_specifically
    above — is separate and already fixed). It can spuriously flip a
    genuinely-sub-$1B name to eligible for one or more monthly buckets.
    `reports/data_quality.py` now runs a permanent sensitivity diagnostic
    for this (see market_cap_eligibility_sensitivity below) rather than
    attempting to fix the underlying vendor data in Phase 1.

decided_for_phase_1: >
  Resolves the former open_question_for_phase_2 below: Phase 1 KEEPS the
  monthly-bucket historical-close x point-in-time-shares-outstanding
  approximation as-is. A filing-date-precise reconstruction (e.g. directly
  from SEC EDGAR filing effective dates) was considered and explicitly
  REJECTED for Phase 1 as disproportionate engineering cost relative to the
  measured impact (see market_cap_eligibility_sensitivity: the affected
  share of the eligible universe is small — see the Phase 1 final report for
  the measured percentage). Instead, the limitation is documented here and
  a standing sensitivity/data-quality diagnostic
  (reports/data_quality.py::market_cap_eligibility_sensitivity) flags every
  build's near-threshold and volatility-driven eligibility cases so the
  impact stays visible rather than hidden. Revisiting filing-precise
  reconstruction remains a legitimate Phase 2 option if the diagnostic ever
  shows material impact on a specific Leader/threshold calibration.

market_cap_eligibility_sensitivity: >
  Diagnostic added to reports/data_quality.py (config knobs in
  config/universe.yaml market_cap.sensitivity): flags (a) ticker-days whose
  market_cap sits within `near_threshold_band_pct` of the $1B eligibility
  cutoff (min_usd) — i.e. eligibility that a plausible vendor-data error
  could flip either way — and (b) tickers whose month-over-month market_cap
  ratio exceeds `volatility_ratio_threshold` at least once while also
  falling within the near-threshold band, which specifically targets the
  MULN-style shares-outstanding-instability pattern above. Both are
  descriptive counts only — no eligibility values are changed by this
  diagnostic.

explicitly_forbidden:
  - "Using today's live market_cap field for a historical eligibility date."
  - "Using today's shares outstanding multiplied by a historical price."
  - "Silently dropping a ticker from history because it lacks a *current* market cap."
  - "Using the split-ADJUSTED close for market_cap (see why_unadjusted_close_specifically above)."

open_question_for_phase_2: >
  RESOLVED for Phase 1 — see decided_for_phase_1 above (the monthly
  approximation is kept, no filing-precise rebuild in Phase 1). Whether a
  stricter point-in-time source (e.g. per-filing-date shares outstanding
  reconstructed directly from SEC EDGAR) is worth the added engineering
  cost remains a legitimate Phase 2 option, to be revisited only if the
  market_cap_eligibility_sensitivity diagnostic shows material impact.
